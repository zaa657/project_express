<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Store Ari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- Top bar with Back and Theme Switcher -->
  <div class="max-w-7xl w-full mx-auto p-4 sm:p-6 flex items-center justify-between">
    <a href="index.html" class="inline-flex items-center gap-2 text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Kembali ke Katalog
    </a>

    <button id="themeToggleBtn" class="p-2 rounded-xl text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 border border-zinc-200 dark:border-zinc-800 transition">
      <svg id="sunIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      <svg id="moonIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>
  </div>

  <!-- Center Card -->
  <div class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-sm">
      
      <!-- Brand & Heading -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl overflow-hidden shadow-sm border border-zinc-200 dark:border-zinc-800 bg-white">
          <img src="logo.jpg" alt="Store Ari Logo" class="w-full h-full object-cover">
        </div>
        <div class="text-xs font-semibold tracking-wider uppercase text-zinc-400 mb-1">Store Ari</div>
        <h2 class="text-xl font-bold tracking-tight">Selamat Datang Kembali</h2>
        <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">Masuk ke akun Anda untuk mengelola produk.</p>
      </div>

      <!-- Feedback Alert -->
      <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl text-xs bg-red-50 text-red-600 border border-red-200 dark:bg-red-950/50 dark:text-red-400 dark:border-red-900"></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Email</label>
          <input
            id="email"
            type="email"
            required
            placeholder="admin@example.com"
            class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 focus:border-zinc-900 dark:focus:border-white focus:outline-none transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Password</label>
          <input
            id="password"
            type="password"
            required
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 focus:border-zinc-900 dark:focus:border-white focus:outline-none transition"
          />
        </div>

        <button
          id="submitBtn"
          type="submit"
          class="w-full mt-2 py-2.5 text-sm font-semibold rounded-xl bg-zinc-900 text-white dark:bg-white dark:text-zinc-950 hover:opacity-90 transition active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <span>Masuk</span>
        </button>
      </form>

      <!-- Footer links -->
      <p class="text-center text-xs text-zinc-500 mt-6">
        Belum punya akun?
        <a href="register.html" class="font-semibold text-zinc-900 dark:text-white underline underline-offset-4 hover:opacity-80">
          Daftar sekarang
        </a>
      </p>

    </div>
  </div>

  <div class="py-4 text-center text-[11px] text-zinc-400">
    Store Ari &copy; 2026
  </div>

  <script>
    // Smart API Base URL: Auto-detects port 3000 vs Live Server port 5500
    const API_BASE = window.location.port === '3000' ? '' : 'http://localhost:3000';

    // Theme toggle
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function applyTheme(isDark) {
      if (isDark) {
        htmlEl.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        localStorage.setItem('theme', 'dark');
      } else {
        htmlEl.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeBtn.addEventListener('click', () => applyTheme(!htmlEl.classList.contains('dark')));

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }

    // Login logic
    const form = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Memproses...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('token', data.data.token);
          window.location.href = 'index.html';
        } else {
          errorAlert.innerText = data.message || 'Login gagal, periksa email dan password';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        errorAlert.innerText = 'Gagal menghubungi server backend di http://localhost:3000. Pastikan server aktif!';
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Masuk';
      }
    });
  </script>
</body>
</html>
