  <!-- Prominent Stylized Monogram "A" -->
  <path d="M 60 36 L 41 84 H 49.5 L 54.5 71 H 65.5 L 70.5 84 H 79 L 60 36 Z M 60 56 L 63.5 64.5 H 56.5 L 60 56 Z" fill="url(#goldGrad)"/>
