<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#997A3A" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="29" stroke="#27272a" stroke-width="1.5"/>

  <!-- Shopping Bag Handle -->
  <path d="M 46 42 C 46 28, 74 28, 74 42" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

